# ===============================
# SERVER CONFIG
# ===============================

spring.application.name=DOUBT-MEETING-SERVICE
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# DATABASE CONFIG (MySQL)
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/mentormates_meeting_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE CONFIG
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# ===============================
# JACKSON DATE FORMAT (Important)
# ===============================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Calcutta


# ===============================
# LOGGING (Optional but useful)
# ===============================

logging.level.org.springframework=INFO
logging.level.com.MentorMate=DEBUG
jwt.secret=MySuperSecretKeyForJWTGenerationAuthService123456
jwt.expiration=86400000
